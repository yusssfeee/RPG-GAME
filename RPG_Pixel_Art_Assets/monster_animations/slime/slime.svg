<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256"><style>
*{shape-rendering:crispEdges}
.slime-core{transform-box:fill-box;transform-origin:50% 90%}
.slime-unit[data-clip="idle"] .slime-core{animation:slime-idle 2.25s steps(8,end) infinite}
.slime-unit[data-clip="walk"] .slime-core{animation:slime-walk .72s steps(6,end) infinite}
.slime-unit[data-clip="attack"] .slime-core{animation:slime-attack .62s steps(6,end) 1}
.slime-unit[data-clip="hurt"] .slime-core{animation:slime-hurt .42s steps(5,end) 1}
.slime-unit[data-clip="death"] .slime-core{animation:slime-death .9s steps(8,end) 1 forwards}
@keyframes slime-idle{0%,100%{transform:translateY(0) scale(1,1)}25%{transform:translateY(-2px) scale(.99,1.025)}50%{transform:translateY(-3px) scale(1.025,.975)}75%{transform:translateY(-1px) scale(1.01,1)}}
@keyframes slime-walk{0%,100%{transform:translateX(-2px) scale(.96,1.04)}25%{transform:translateX(0) translateY(-5px) scale(1.04,.94)}50%{transform:translateX(2px) scale(.96,1.05)}75%{transform:translateX(0) translateY(-4px) scale(1.04,.95)}}
@keyframes slime-attack{0%{transform:translateX(0) scale(1,1)}20%{transform:translateX(-7px) scale(1.18,.82)}45%{transform:translateX(15px) translateY(-4px) scale(.88,1.18)}70%{transform:translateX(9px) scale(1.1,.9)}100%{transform:translateX(0) scale(1,1)}}
@keyframes slime-hurt{0%,100%{transform:translateX(0) scale(1)}20%{transform:translateX(-6px) scale(.88,1.12)}45%{transform:translateX(5px) scale(1.08,.92)}70%{transform:translateX(-2px) scale(.96,1.04)}}
@keyframes slime-death{0%{transform:translateY(0) scale(1);opacity:1}20%{transform:translateY(-7px) scale(1.08,.9);opacity:1}50%{transform:translateY(7px) scale(1.2,.55);opacity:.9}80%{transform:translateY(9px) scale(1.35,.18);opacity:.45}100%{transform:translateY(12px) scale(1.45,.02);opacity:0}}
</style><rect width="100" height="100" fill="none"/><g class="slime-unit slime-slime" data-clip="idle"><g class="slime-core"><ellipse cx="50" cy="91" rx="32" ry="4" fill="#071b13" opacity=".38"/><path d="M12 84 L10 75 L14 61 L20 49 L30 39 L42 34 L55 34 L68 39 L79 50 L87 65 L90 77 L87 84 L78 88 L22 88 Z" fill="#43d96b" stroke="#126b42" stroke-width="3.2" stroke-linejoin="miter"/><path d="M12 84 L10 75 L14 61 L20 49 L30 39 L42 34 L55 34 L68 39 L79 50 L87 65 L90 77 L87 84 L78 88 L22 88 Z" fill="none" stroke="#26b957" stroke-width="1.2" stroke-linejoin="miter" transform="translate(0 -1)"/><path d="M18 75L22 61 30 53 34 55 28 68 27 80Z" fill="#7af18b"/><path d="M58 39l10 5 8 10-7 2-9-8z" fill="#b7ffb0"/><path d="M16 78l7-3 4 5-7 4zM74 78l8-5 4 6-7 5z" fill="#1e9e50"/><circle cx="20" cy="57" r="3" fill="#d9ffb7"/><circle cx="78" cy="61" r="2.5" fill="#d9ffb7"/><circle cx="50" cy="47" r="2" fill="#eaffd4"/><ellipse cx="38" cy="65" rx="5.5" ry="8" fill="#f8fff0"/><ellipse cx="63" cy="65" rx="5.5" ry="8" fill="#f8fff0"/><ellipse cx="39" cy="67" rx="2.8" ry="5" fill="#102c22"/><ellipse cx="64" cy="67" rx="2.8" ry="5" fill="#102c22"/><rect x="36" y="60" width="2" height="2" fill="#fff"/><rect x="61" y="60" width="2" height="2" fill="#fff"/><path d="M46 78q5 4 10 0" fill="none" stroke="#145b37" stroke-width="2.5" stroke-linecap="square"/><path d="M24 83l8 3 5-2M68 85l8-3" fill="none" stroke="#126b42" stroke-width="2"/></g></g></svg>